name: Documentation issue
description: Report missing, incorrect, or confusing Lumen Crawler documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or security vulnerabilities. Use private vulnerability reporting for security issues.
  - type: input
    id: page
    attributes:
      label: Page or route
      placeholder: https://docs.crawler.lumen-labs.ai/docs/v2/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would help?
  - type: dropdown
    id: audience
    attributes:
      label: Reader role
      options:
        - Application developer
        - Agent author
        - Operator
        - Other
